name: 🔀 Auto Merge

# A trusted default-branch workflow handles only the linked current-head CI run.
# Review events execute PR workflows, so they do not receive this write token.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read

jobs:
  auto-merge:
    name: Auto-merge eligible PR
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: trusted-merge-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Require protection, trusted current CI and human review
        run: python3 .github/scripts/workflow_trust.py merge
        env:
          GH_TOKEN: ${{ github.token }}
