name: Approve Label Handler

on:
  workflow_run:
    workflows: ["Approve Label Trigger"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write

jobs:
  handle-label:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Reflect current independent human reviews
        # No artifact, /approve command or model verdict can submit an approval.
        run: python3 .github/scripts/workflow_trust.py label
        env:
          GH_TOKEN: ${{ github.token }}
