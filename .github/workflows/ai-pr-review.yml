name: 🤖 AI Code Review & Labeler

# Only the workflow's trusted commit is checked out. PR text is model input only.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main, dev]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: ai-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: Groq AI Review & Label
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && github.event.comment.body == '/review') }}
    steps:
      - name: Checkout trusted workflow policy
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Post advisory comment and safe labels
        run: python3 .github/scripts/workflow_trust.py ai
        env:
          GH_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
